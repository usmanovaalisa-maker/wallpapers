<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Дари Сейчас — Тёплое пожелание</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <meta name="description" content="Откройте тёплое пожелание дня от бренда «Дари Сейчас». Новое сообщение при каждом открытии и без повторов, пока не увидите все!" />
  <style>
    :root {
      --bg: #fff9f2;
      --card: #ffffff;
      --ink: #222222;
      --sub: #666666;
      --brand: #ff6a3d;  /* акцент */
      --accent: #06b6d4; /* второй акцент */
      --radius: 20px;
      --glow1: #fff3e6;
      --glow2: #eefbff;
      --line: #eeeeee;
      --btn2-bg: #f1f5f9;
      --btn2-ink: #0f172a;
    }
    /* тёмная тема: ?theme=dark */
    :root[data-theme="dark"] {
      --bg: #0b1220;
      --card: #0f172a;
      --ink: #e5e7eb;
      --sub: #94a3b8;
      --glow1: #1a2336;
      --glow2: #0f2233;
      --line: #1f2a3d;
      --btn2-bg: #1e293b;
      --btn2-ink: #e5e7eb;
    }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 800px at 20% 0%, var(--glow1) 0%, var(--bg) 60%),
                  radial-gradient(900px 600px at 100% 100%, var(--glow2) 0%, var(--bg) 40%);
      color: var(--ink);
      display: grid; place-items: center;
    }
    .wrap { width: min(720px, 100%); padding: 16px; box-sizing: border-box; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      overflow: hidden;
      position: relative;
    }
    .brand {
      display:flex; flex-direction:column; align-items:center; gap:4px; padding: 16px 20px 14px; border-bottom: 1px dashed var(--line); background: var(--card);
    }
    .logo { display:block; width: min(220px, 62%); height: auto; }
    .brand .subtitle { color: var(--sub); font-size: 14px; }
    .content { padding: 28px 22px 8px 22px; text-align: center; }
    .aff {
      font-size: clamp(22px, 3.2vw, 30px);
      line-height: 1.25; font-weight: 750; letter-spacing: 0.2px;
    }
    .hint { color: var(--sub); margin-top: 14px; font-size: 14px; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding: 20px; }
    button {
      border: none; border-radius: 999px; padding: 12px 18px; cursor: pointer; font-weight: 700; letter-spacing: .2px;
      background: var(--ink); color: var(--card); transition: transform .05s ease, box-shadow .2s ease;
    }
    button.secondary { background: var(--btn2-bg); color: var(--btn2-ink); }
    button:active { transform: translateY(1px); }
    .footer { text-align:center; color: var(--sub); font-size: 12px; padding: 0 18px 20px; }

    /* простая анимация конфетти-эмодзи */
    .confetti { position: absolute; inset: 0; pointer-events:none; overflow:hidden; }
    .piece { position:absolute; font-size: 22px; opacity: 0; animation: boom 1200ms ease-out forwards; }
    @keyframes boom { from { transform: translate(0,0) rotate(0deg); opacity: 1; } to { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; } }

    /* режим компакт для маленьких экранов QR */
    @media (max-width: 380px) { .brand .subtitle{ display:none; } .actions{ gap:8px; } button{ padding:11px 14px; font-size:14px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="brand">
        <img class="logo" src="logo.svg" alt="Дари Сейчас" />
        <div class="subtitle">Открой тёплое пожелание дня</div>
      </div>
      <div class="content">
        <div class="aff" id="aff">…</div>
        <div class="hint" id="hint">Каждое открытие — новое послание. Без повторов, пока не увидите всё.</div>
      </div>
      <div class="actions">
        <button id="moreBtn">Ещё пожелание</button>
        <button id="copyBtn" class="secondary">Скопировать</button>
        <button id="shareBtn" class="secondary">Поделиться</button>
      </div>
      <div class="footer">С любовью и чаем — ваш бренд «Дари Сейчас»</div>
      <div class="confetti" id="confetti" aria-hidden="true"></div>
    </div>
  </div>

  <script>
    /**
     * НАСТРОЙКИ
     * Можно указать набор через параметр URL ?set=newyear|birthday|kids|tea|default
     * Пример: https://usmanovaalisa-maker.github.io/wallpapers/?set=newyear
     */
    const SETS = {
      default: [
        "Ты — самый добрый повод улыбнуться сегодня.",
        "Пусть этот чай согреет мечту и приблизит её на шаг.",
        "Всё получится. Маленькие шаги творят большие чудеса.",
        "Ты делаешь этот мир вкуснее и теплее.",
        "Сегодня — отличный день начать с улыбки.",
        "Бери с полки радость — она твоя!",
        "Вдох — спокойствие, выдох — благодарность.",
        "Чашка чая и добрые мысли — идеальная суперсила.",
        "Ты — подарок для тех, кто рядом.",
        "Сладкие моменты дня уже в пути к тебе."
      ],
      newyear: [
        "Новый год — новая глава, наполни её радостью.",
        "Пусть желания сбудутся быстрее, чем тает снежинка на ладони.",
        "Символ года приносит удачу тем, кто улыбается первым.",
        "В каждый день — по маленькому чуду!" 
      ],
      birthday: [
        "Сегодня твой день — лови счастье пригоршнями!",
        "Пусть свечи исполнят всё задуманное.",
        "Ты — главный герой своего праздника.",
        "Сделай желание — вселенная уже слушает." 
      ],
      kids: [
        "Ты супер! И точка.",
        "Сегодняшняя улыбка — твоя суперсила.",
        "Делись конфеткой, и счастья станет больше!",
        "Играй, мечтай, сияй!" 
      ],
      tea: [
        "Глоток тепла — и день становится мягче.",
        "Пей чай, а не переживания.",
        "С каждой чашкой — больше спокойствия и уюта.",
        "Тёплые мысли завариваются первыми." 
      ]
    };

    const params = new URLSearchParams(location.search);
    const setParam = (params.get('set') || '').toLowerCase();

    // Элементы
    const affEl = document.getElementById('aff');
    const hintEl = document.getElementById('hint');
    const moreBtn = document.getElementById('moreBtn');
    const copyBtn = document.getElementById('copyBtn');
    const shareBtn = document.getElementById('shareBtn');
    const confettiEl = document.getElementById('confetti');

    // localStorage может быть недоступен (инкогнито, заблокированные cookies) — тогда просто не запоминаем
    function load(key){ try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch(e){ return null; } }
    function save(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

    function shuffle(arr){
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /**
     * РЕЖИМ «АФФИРМАЦИЯ ДНЯ» (по умолчанию, без ?set=)
     * Фразы берутся из wishes/fans.json с учётом даты: свежие фразы дня, праздник, месяц, общие.
     * У каждого человека своя фраза на сегодня; при повторном открытии в тот же день — та же,
     * «Ещё пожелание» даёт следующую. Уже виденные фразы не повторяются, пока не закончатся все.
     */
    const pad = n => String(n).padStart(2, '0');
    const today = new Date();
    const todayISO = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

    function holidayMatches(h, d){
      if (h.rule) {
        const {month, weekday, nth} = h.rule;
        if (d.getMonth()+1 !== month || d.getDay() !== weekday) return false;
        if (nth > 0) return Math.ceil(d.getDate() / 7) === nth;
        const next = new Date(d); next.setDate(d.getDate() + 7);
        return next.getMonth() !== d.getMonth(); // последний такой день недели в месяце
      }
      const md = `${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      return h.from <= h.to ? (md >= h.from && md <= h.to) : (md >= h.from || md <= h.to); // диапазон через Новый год
    }

    function buildDayPool(data){
      const holidays = (data.holidays || []).filter(h => holidayMatches(h, today));
      const special = [...((data.daily || {})[todayISO] || []), ...holidays.flatMap(h => h.fans)];
      const seasonal = (data.months || {})[String(today.getMonth()+1)] || [];
      const general = data.general || [];
      const seen = new Set(load('affSeen') || []);
      // сначала невиденные, внутри — сначала праздничные/свежие, потом сезонные, потом общие
      const groups = [special, seasonal, general].map(g => shuffle([...new Set(g)]));
      const all = [...new Set(groups.flat())];
      const items = [...all.filter(t => !seen.has(t)), ...all.filter(t => seen.has(t))];
      return { items, holiday: holidays.map(h => h.name).join(', ') };
    }

    function markSeen(text){
      const seen = load('affSeen') || [];
      if (!seen.includes(text)) { seen.push(text); save('affSeen', seen.slice(-2000)); }
    }

    let MESSAGES = [], POOL_VERSION = '', pool = null, dayMode = false;

    function initSetMode(){
      // Можно указать набор через параметр URL ?set=newyear|birthday|kids|tea|default
      const key = SETS[setParam] ? setParam : 'default';
      MESSAGES = SETS[key].slice();
      // Версия пула (менять при обновлении списков, чтобы сбрасывался localStorage)
      POOL_VERSION = `v1-${key}`;
      const saved = load('affirmationPool');
      pool = (saved && saved.version === POOL_VERSION && Array.isArray(saved.items) && typeof saved.index === 'number')
        ? saved : { version: POOL_VERSION, items: shuffle(MESSAGES.slice()), index: 0 };
      nextMessage();
    }

    function initDayMode(data){
      dayMode = true;
      const { items, holiday } = buildDayPool(data);
      MESSAGES = items;
      POOL_VERSION = `day-${todayISO}`;
      const dateText = today.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
      hintEl.textContent = `Аффирмация дня · ${dateText}` + (holiday ? ` · ${holiday}` : '');
      const saved = load('affirmationDay');
      if (saved && saved.version === POOL_VERSION && Array.isArray(saved.items) && saved.index > 0) {
        pool = saved;
        renderMessage(pool.items[pool.index - 1]); // та же фраза дня при повторном открытии
      } else {
        pool = { version: POOL_VERSION, items, index: 0 };
        nextMessage();
      }
    }

    function nextMessage() {
      if (!pool) return; // фразы ещё загружаются
      // если дошли до конца — тасуем заново без повторов
      if (pool.index >= pool.items.length) {
        pool.items = shuffle(MESSAGES.slice());
        pool.index = 0;
      }
      const msg = pool.items[pool.index++];
      if (dayMode) { save('affirmationDay', pool); markSeen(msg); } else save('affirmationPool', pool);
      renderMessage(msg);
    }

    function renderMessage(text){
      affEl.textContent = text;
      burst();
    }

    function burst(){
      // простое конфетти на эмодзи без библиотек
      const icons = ['✨','🎉','💫','🍬','🌟','🎈'];
      for(let i=0;i<16;i++){
        const span = document.createElement('span');
        span.className = 'piece';
        span.textContent = icons[Math.floor(Math.random()*icons.length)];
        span.style.left = (50 + (Math.random()*20-10)) + '%';
        span.style.top = '40%';
        span.style.setProperty('--tx', (Math.random()*200-100) + 'px');
        span.style.setProperty('--ty', (200 + Math.random()*200) + 'px');
        span.style.setProperty('--rot', (Math.random()*720-360) + 'deg');
        confettiEl.appendChild(span);
        setTimeout(()=> span.remove(), 1300);
      }
    }

    // Кнопки
    moreBtn.addEventListener('click', nextMessage);
    copyBtn.addEventListener('click', async ()=>{
      try { await navigator.clipboard.writeText(affEl.textContent.trim());
        flash(copyBtn, 'Скопировано!'); } catch(e){ flash(copyBtn, 'Не удалось скопировать'); }
    });
    shareBtn.addEventListener('click', async ()=>{
      const text = affEl.textContent.trim() + ' — с любовью от «Дари Сейчас»';
      if (navigator.share) {
        try { await navigator.share({ title: 'Пожелание дня', text }); } catch(e){}
      } else { try { await navigator.clipboard.writeText(text); } catch(e){} flash(shareBtn, 'Скопировано для отправки'); }
    });

    function flash(btn, label){
      const prev = btn.textContent; btn.textContent = label; btn.disabled = true;
      setTimeout(()=>{ btn.textContent = prev; btn.disabled = false; }, 1100);
    }

    // Показ при загрузке: с ?set= — старые наборы, иначе аффирмация дня из wishes/fans.json
    if (setParam) initSetMode();
    else fetch('wishes/fans.json', { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(initDayMode)
      .catch(initSetMode);

    // Если нужно: смена темы через ?theme=dark
    (function themeFromURL(){
      const t = (params.get('theme')||'').toLowerCase();
      if (t === 'dark') document.documentElement.dataset.theme = 'dark';
    })();
  </script>
</body>
</html>
