<!doctype html>
<!-- Встроенные сцены «Дари Сейчас»: локальный SVG, шрифты и логотип. 1080 × 1080. -->
<html lang="ru"><head><meta charset="utf-8">
<link href="fonts.css" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  :root { --scene-top:#315568; --scene-bottom:#173047; --cream:#fff5dc; --gold:#f3ca69; }
  body { width:1080px; height:1080px; overflow:hidden; font-family:Nunito,sans-serif; }
  .poster { position:relative; width:1080px; height:1080px; overflow:hidden;
    background:radial-gradient(ellipse at 50% 35%,#ffffff09,transparent 70%),
      linear-gradient(160deg,var(--scene-top),var(--scene-bottom)); }
  .garland { position:absolute; top:0; left:0; width:1080px; height:55px; }
  .logo { position:absolute; left:64px; top:79px; width:112px; height:112px;
    background:#fff; padding:8px 11px; border-radius:25px; box-shadow:0 9px 22px #0002; }
  .badge { position:absolute; left:204px; top:80px; font-size:44px; line-height:1.1;
    font-weight:900; color:var(--cream); letter-spacing:-.6px; white-space:nowrap; }
  .accent { position:absolute; top:140px; left:207px; width:67px; height:4px;
    border-radius:2px; background:#ef6269; }
  .date { position:absolute; left:204px; top:160px; font-size:24px; line-height:1;
    font-weight:800; color:#e2edf3; }
  .sticker { position:absolute; right:62px; top:84px; width:222px; min-height:98px;
    padding:15px 20px; border:1px solid #fff5dc45; border-radius:23px;
    background:#fff5dc0d; color:var(--cream); display:none; text-align:center; }
  .sticker.on { display:block; }
  .sticker .k { font-size:12px; line-height:1; font-weight:900; letter-spacing:2.5px;
    text-transform:uppercase; color:var(--gold); margin-bottom:9px; }
  .sticker .t { font-size:24px; line-height:1.12; font-weight:900; overflow-wrap:break-word; }
  .scene { position:absolute; left:0; top:224px; width:1080px; height:460px; }
  .scene svg { display:block; width:100%; height:100%; }
  .card { position:absolute; left:64px; top:700px; width:952px; height:276px;
    border-radius:32px; padding:30px 44px; background:#fffaf0;
    border:2px solid #f3ca69; box-shadow:0 17px 36px #0002;
    display:flex; align-items:center; justify-content:center; }
  .text { width:100%; font-size:44px; line-height:1.22; font-weight:900;
    color:#253955; text-align:center; overflow-wrap:break-word; }
  .footer { position:absolute; top:1012px; left:64px; right:64px; display:flex;
    align-items:center; justify-content:space-between; color:#e7edf1;
    font-weight:800; font-size:22px; line-height:1; }
  .footer b { color:var(--gold); font-weight:900; }
  .footer .season { letter-spacing:1px; font-size:18px; color:#cadce2; }
</style></head>
<body><div class="poster">
  <svg class="garland" viewBox="0 0 1080 55" aria-hidden="true" id="garland"></svg>
  <img class="logo" src="../../logo.svg" alt="Дари Сейчас">
  <div class="badge">Новогодний сезон</div>
  <div class="accent"></div>
  <div class="date" id="date"></div>
  <div class="sticker" id="sticker"><div class="k">Сегодня</div><div class="t" id="sttitle"></div></div>
  <div class="scene" id="scene"></div>
  <div class="card"><div class="text" id="text"></div></div>
  <div class="footer"><span>Маленькие радости · <b>«Дари Сейчас»</b></span><span class="season">НГ 2026–2027</span></div>
</div>
<script src="scenes.js"></script>
<script>
  (function () {
    const colors=['#ef6269','#f3ca69','#76c8ae','#b5a0d6','#8ebcda'];
    let svg='<path d="M0 1Q135 65 270 1T540 1T810 1T1080 1" stroke="#142c3d" stroke-width="3" fill="none"/>';
    for(let i=0;i<24;i++) {
      const x=23+i*45,t=(x%270)/270,y=1+32*4*t*(1-t);
      svg+='<ellipse cx="'+x+'" cy="'+(y+6)+'" rx="6" ry="9" fill="'+colors[i%5]+'"/>';
    }
    document.getElementById('garland').innerHTML=svg;
  })();
  window.fill=(text,date,seed,occasion)=>{
    if (!window.NGScenes) throw new Error('Не загружены встроенные сцены');
    const art=NGScenes.build(occasion && occasion.icon,seed);
    document.documentElement.style.setProperty('--scene-top',art.top);
    document.documentElement.style.setProperty('--scene-bottom',art.bottom);
    document.getElementById('scene').innerHTML=art.svg;
    document.getElementById('scene').dataset.scene=art.id;
    document.getElementById('scene').dataset.variant=art.variant;
    const sticker=document.getElementById('sticker'),title=document.getElementById('sttitle');
    title.textContent=occasion && occasion.title ? occasion.title : '';
    sticker.classList.toggle('on',Boolean(title.textContent));
    let titleSize=24; title.style.fontSize=titleSize+'px';
    while(titleSize>17 && title.scrollHeight>64) { titleSize--; title.style.fontSize=titleSize+'px'; }
    if(title.textContent && title.scrollHeight>64) throw new Error('Не помещается название повода');
    document.getElementById('date').textContent=date;
    const el=document.getElementById('text'),card=el.parentElement;
    el.textContent=text;
    let size=44; el.style.fontSize=size+'px';
    const available=card.clientHeight-60;
    while(size>26 && el.scrollHeight>available) { size-=2; el.style.fontSize=size+'px'; }
    if(el.scrollHeight>available) throw new Error('Текст не помещается в карточку');
    return size;
  };
</script></body></html>
