<!doctype html>
<!-- Шаблон картинки «Напутствие дня» для Битрикс24 (1080×1080). Текст подставляет scripts/make_card.py -->
<html lang="ru"><head><meta charset="utf-8">
<link href="fonts.css" rel="stylesheet">
<style>
  :root { --purple:#876db0; --deep:#5b3f93; --blue:#4c76bb; --yellow:#f2c926; --pink:#ff7eb3; --mint:#5fd3b3; --ink:#2b2b33; }
  * { box-sizing:border-box; margin:0; }
  body { width:1080px; height:1080px; overflow:hidden; font-family:Nunito, sans-serif; }
  .poster { position:relative; width:1080px; height:1080px; overflow:hidden;
    background:
      radial-gradient(620px 520px at 0% 0%, #ffd9ec 0%, transparent 70%),
      radial-gradient(640px 560px at 100% 100%, #d6e6ff 0%, transparent 70%),
      radial-gradient(560px 480px at 100% 0%, #fff0b3 0%, transparent 70%),
      radial-gradient(520px 460px at 0% 100%, #d9f7ec 0%, transparent 70%),
      #fdf6ff;
    display:flex; flex-direction:column; align-items:center; padding:46px 80px 0; }
  #confetti { position:absolute; inset:0; }
  .piece { position:absolute; border-radius:3px; }
  .balloon { position:absolute; }
  .logo { width:250px; position:relative; }
  .badge { position:relative; margin-top:6px; transform:rotate(-3deg); background:var(--purple); color:#fff;
    font-weight:900; font-size:64px; line-height:1; padding:18px 44px 22px; border-radius:30px;
    box-shadow:0 10px 0 var(--deep), 0 22px 40px rgba(91,63,147,.35); letter-spacing:-.5px; white-space:nowrap; }
  .date { position:relative; margin-top:30px; font-weight:800; font-size:28px; color:var(--deep);
    background:#fff; padding:9px 26px; border-radius:999px; box-shadow:0 6px 18px rgba(135,109,176,.18); }
  .card { position:relative; margin-top:34px; width:100%; height:470px; background:#fff; border-radius:52px;
    padding:48px 64px; box-shadow:0 26px 60px rgba(135,109,176,.28); border:6px dashed #f3d9f0;
    display:flex; align-items:center; justify-content:center; }
  .text { font-weight:900; font-size:60px; line-height:1.18; color:var(--ink); text-align:center; }
  .text .hl { color:var(--purple); }
  .gift { position:absolute; right:-34px; bottom:-40px; width:170px; transform:rotate(12deg); }
  .heart { position:absolute; left:-26px; top:-30px; width:96px; transform:rotate(-14deg); }
  .footer { position:relative; margin-top:40px; font-weight:800; font-size:30px; color:var(--deep); }
  .footer b { color:var(--pink); font-weight:900; }
</style></head>
<body><div class="poster">
  <div id="confetti"></div>

  <svg class="balloon" style="left:40px;top:230px" width="120" height="220" viewBox="0 0 60 110"><path d="M30 2C14 2 4 15 4 30c0 18 15 32 26 36 11-4 26-18 26-36C56 15 46 2 30 2z" fill="#ff7eb3"/><path d="M27 66h6l-3 5z" fill="#ff7eb3"/><path d="M30 71c-6 10 6 18 0 28s4 10 0 11" stroke="#e0a3c4" stroke-width="1.5" fill="none"/><ellipse cx="21" cy="20" rx="5" ry="8" fill="#fff" opacity=".45"/></svg>
  <svg class="balloon" style="right:44px;top:150px" width="130" height="240" viewBox="0 0 60 110"><path d="M30 2C14 2 4 15 4 30c0 18 15 32 26 36 11-4 26-18 26-36C56 15 46 2 30 2z" fill="#f2c926"/><path d="M27 66h6l-3 5z" fill="#f2c926"/><path d="M30 71c-6 10 6 18 0 28s4 10 0 11" stroke="#d8c27a" stroke-width="1.5" fill="none"/><ellipse cx="21" cy="20" rx="5" ry="8" fill="#fff" opacity=".5"/></svg>
  <svg class="balloon" style="right:150px;top:40px" width="80" height="150" viewBox="0 0 60 110"><path d="M30 2C14 2 4 15 4 30c0 18 15 32 26 36 11-4 26-18 26-36C56 15 46 2 30 2z" fill="#4c76bb"/><path d="M27 66h6l-3 5z" fill="#4c76bb"/><path d="M30 71c-6 10 6 18 0 28s4 10 0 11" stroke="#9db3d9" stroke-width="1.5" fill="none"/><ellipse cx="21" cy="20" rx="5" ry="8" fill="#fff" opacity=".4"/></svg>

  <img class="logo" src="../../logo.svg" alt="">
  <div class="badge">Напутствие дня</div>
  <div class="date" id="date">вторник, 29 сентября</div>
  <div class="card">
    <svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.5.8-1.3 2.3-2.5 4.4-2.5 3.6 0 5.8 3.7 4.2 7.3C19.5 16.4 12 21 12 21z" fill="#ff7eb3"/></svg>
    <div class="text" id="text">Доброе утро, команда!</div>
    <svg class="gift" viewBox="0 0 100 100"><rect x="12" y="44" width="76" height="50" rx="8" fill="#876db0"/><rect x="6" y="30" width="88" height="20" rx="6" fill="#9d86c4"/><rect x="44" y="30" width="12" height="64" fill="#f2c926"/><path d="M50 30c-6-14-26-18-26-6 0 8 14 8 26 6zM50 30c6-14 26-18 26-6 0 8-14 8-26 6z" fill="#f2c926"/><circle cx="50" cy="29" r="5" fill="#e0b41a"/></svg>
  </div>
  <div class="footer">С заботой — <b>«Дари Радость»</b></div>
</div>
<script>
  // Конфетти: раскладка зависит от даты, поэтому каждый день немного другая
  function confetti(seed) {
    let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const colors = ['#ff7eb3', '#f2c926', '#4c76bb', '#876db0', '#5fd3b3', '#ff9f5a'];
    const box = document.getElementById('confetti'); box.innerHTML = '';
    for (let i = 0; i < 70; i++) {
      const p = document.createElement('div'); p.className = 'piece';
      const x = rnd() * 1080, y = rnd() * 1080;
      // не сыпем конфетти на карточку с текстом и подпись
      if ((x > 60 && x < 1020 && y > 470 && y < 960) || (x > 280 && x < 800 && y > 1000)) { i--; continue; }
      const round = rnd() < .35, w = 10 + rnd() * 14, h = round ? w : 6 + rnd() * 8;
      Object.assign(p.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px',
        background: colors[Math.floor(rnd() * colors.length)], borderRadius: round ? '50%' : '3px',
        transform: `rotate(${Math.floor(rnd() * 180)}deg)`, opacity: .85 });
      box.appendChild(p);
    }
  }
  // Подставляет текст и уменьшает шрифт, пока текст не поместится в карточку
  window.fill = (text, date, seed) => {
    const el = document.getElementById('text'), card = el.parentElement;
    document.getElementById('date').textContent = date;
    el.textContent = text;
    confetti(seed || 7);
    let size = 64;
    el.style.fontSize = size + 'px';
    while (size > 30 && el.scrollHeight > card.clientHeight - 96) { size -= 2; el.style.fontSize = size + 'px'; }
    return size;
  };
</script>
</body></html>
