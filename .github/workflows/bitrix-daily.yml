name: Напутствие дня в Битрикс24

on:
  schedule:
    # 06:00 UTC = 10:00 по Самаре (GMT+4): к этому времени TrueStats уже пересчитал вчерашний день.
    # GitHub может запускать с большим опозданием (бывает на часы), поэтому в 11:30 запуск делает
    # ещё и ежедневное задание Claude; повторной отправки не будет — см. шаг «Уже отправляли сегодня?»
    - cron: "0 6 * * *"
    # повторы в 12:30 и 14:00 по Самаре: если TrueStats ещё не выгрузил вчера (продажи и реализация = 0),
    # рассылка откладывается до следующего запуска; после отправки повторы ничего не делают
    - cron: "30 8 * * *"
    - cron: "0 10 * * *"
  # Запуск с компьютера: локальная задача Claude в 11:30 пушит фразы на завтра и отметку
  # .github/last-local-run — этот push и запускает рассылку (раньше 10:00 по Самаре не отправляет)
  push:
    branches: [main]
    paths: ["wishes/**", ".github/last-local-run"]
  workflow_dispatch:
    inputs:
      date:
        description: "Дата ГГГГ-ММ-ДД (пусто — сегодня)"
        required: false
      dry_run:
        description: "Только показать текст и картинку, не отправлять"
        type: boolean
        default: false

permissions:
  contents: write # чтобы сохранить картинку дня в папку cards/ и получить на неё ссылку

concurrency: bitrix-daily

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      WISH_TZ: ${{ vars.WISH_TZ }}
      WISH_DATE: ${{ inputs.date }}
      # Итоги прошедшего дня — только из TrueStats (scripts/day_results.py); цифры не пишутся ни в лог, ни в репозиторий
      TRUE_STATS: ${{ secrets.TRUE_STATS }}
      # только магазины «Дари Радость» и «Дари сейчас» (Wildberries и Ozon)
      TRUESTATS_ACCOUNTS: ${{ vars.TRUESTATS_ACCOUNTS || 'Дари Радость, Дари сейчас' }}
    steps:
      - uses: actions/checkout@v5

      # Если напутствие на сегодня уже отправили вручную, запоздавший плановый запуск ничего не делает.
      # Признак отправки — сохранённая картинка дня cards/ДАТА.jpg (её коммитит только настоящая отправка).
      - name: Уже отправляли сегодня?
        id: check
        if: github.event_name != 'workflow_dispatch'
        run: |
          d=$(TZ="${WISH_TZ:-Europe/Samara}" date +%F)
          h=$(TZ="${WISH_TZ:-Europe/Samara}" date +%H)
          if [ "${{ github.event_name }}" = "push" ] && [ "$h" -lt 10 ]; then echo "Push раньше 10:00 по Самаре — не отправляем (отправит запуск в 10:00)."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q origin main  # смотрим на свежую main: запуск от push видит только свой коммит
          if git cat-file -e "origin/main:cards/$d.jpg" 2>/dev/null; then echo "Напутствие на $d уже отправлено — пропускаем."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v6
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install playwright
        if: steps.check.outputs.skip != 'true'

      - name: Рисуем картинку дня
        id: card
        if: steps.check.outputs.skip != 'true'
        run: python scripts/send_bitrix.py
        env:
          CARD: "1"

      - name: Показываем картинку (проверка без отправки)
        if: inputs.dry_run && steps.card.outputs.card
        uses: actions/upload-artifact@v4
        with:
          name: card
          path: ${{ steps.card.outputs.card }}

      - name: Сохраняем картинку, чтобы у неё была ссылка
        id: save
        if: ${{ !inputs.dry_run && steps.card.outputs.card }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.card.outputs.card }}"
          git diff --cached --quiet || git commit -m "Картинка напутствия: ${{ steps.card.outputs.card }}"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          echo "url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)/${{ steps.card.outputs.card }}" >> "$GITHUB_OUTPUT"

      - name: Отправляем в Битрикс24
        if: steps.check.outputs.skip != 'true'
        run: python scripts/send_bitrix.py
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          BITRIX_DIALOG_ID: ${{ vars.BITRIX_DIALOG_ID }}
          BITRIX_CHAT_NAME: ${{ vars.BITRIX_CHAT_NAME || 'Доброплан 2026 _ Чат руководителей' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CARD_URL: ${{ steps.save.outputs.url }}
