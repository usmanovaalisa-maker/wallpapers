name: Разведка API TrueStats (временно)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TRUE_STATS: ${{ secrets.TRUE_STATS }}
    steps:
      - name: Какой ключ фильтра по группе работает (в лог — без сумм)
        shell: python
        run: |
          import os, json, urllib.request, datetime as dt
          key = os.environ["TRUE_STATS"].strip()
          def day(filters):
              y = dt.date.today() - dt.timedelta(days=1)
              body = {"dateFrom": (y - dt.timedelta(days=30)).isoformat(), "dateTo": y.isoformat()}
              if filters is not None: body["filters"] = filters
              r = urllib.request.Request("https://api.truestats.ru/reporting/aggregated-view/day", data=json.dumps(body).encode(),
                  headers={"X-Api-Token": key, "Content-Type": "application/json", "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(r, timeout=90) as resp: d = json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  return e.code, None, 0, e.read().decode()[:300]
              res = d.get("result", [])
              return 200, sum(float(x.get("ordersCount") or 0) for x in res), sum(1 for x in res if x.get("ordersCount")), ""
          st, total, days, _ = day(None)
          print("без фильтра:", st, "дней с заказами:", days)
          G = 132336
          for f in ({"group": [G]}, {"groups": [G]}, {"group": G}, {"groupIds": [G]}, {"group": [str(G)]}, {"groups": [str(G)]}):
              st, t, dd, err = day(f)
              if st != 200:
                  print(json.dumps(f), "->", st, err); continue
              print(json.dumps(f), "-> 200, дней с заказами:", dd, "| заказов меньше, чем всего:", t < total, "| ноль:", t == 0)
