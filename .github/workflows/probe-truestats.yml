name: Разведка API TrueStats (временно)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TRUE_STATS: ${{ secrets.TRUE_STATS }}
    steps:
      - name: Читаем документацию публичного API (в лог — только описание и коды ответов, без данных)
        shell: python
        run: |
          import re, os, json, urllib.request, html
          key = os.environ.get("TRUE_STATS", "").strip()
          print("ключ задан:", bool(key), "длина:", len(key))
          def get(u, auth=None):
              h = {"User-Agent": "Mozilla/5.0", "Accept": "application/json, text/html"}
              if auth == "x": h["X-AUTH-TOKEN"] = key
              if auth == "b": h["Authorization"] = "Bearer " + key
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=h), timeout=30)
                  return r.status, r.headers.get("Content-Type", ""), r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("Content-Type", ""), e.read().decode("utf-8", "replace")[:400]
              except Exception as e:
                  return type(e).__name__, "", ""
          text = lambda b: " ".join(html.unescape(re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", b, flags=re.S)).split())

          st, ct, b = get("https://truestats.usedocs.com/article/84276")
          body = re.search(r'<article.*?</article>', b, re.S)
          print("\n=== ARTICLE API / Интеграции", st, "\n", text(body.group(0) if body else b)[:8000])

          for base in ["https://api.truestats.ru", "https://app.truestats.ru"]:
              for auth in (None, "x", "b"):
                  st, ct, b = get(base + "/api/public/doc", auth)
                  print(f"\n=== {base}/api/public/doc auth={auth} -> {st} {ct} len={len(b)}")
                  if st == 200:
                      # печатаем документацию: это описание методов, не данные
                      spec = re.search(r'(\{"openapi".*?\})\s*</script>|(\{"swagger".*?\})\s*</script>|data-spec="([^"]+)"', b, re.S)
                      if "json" in ct:
                          try:
                              d = json.loads(b)
                              for p, ops in d.get("paths", {}).items():
                                  for m, op in ops.items():
                                      params = [x.get("name") for x in op.get("parameters", [])]
                                      print(f"  {m.upper()} {p} | {op.get('summary','')} | params={params}")
                              print("  securitySchemes:", json.dumps(d.get("components", {}).get("securitySchemes", {}), ensure_ascii=False))
                          except Exception as e:
                              print("  json err", e, b[:1500])
                      else:
                          m = re.search(r'id="swagger-data"[^>]*>(.*?)</script>', b, re.S)
                          if m:
                              d = json.loads(html.unescape(m.group(1)))
                              spec = d.get("spec", d)
                              for p, ops in spec.get("paths", {}).items():
                                  for mm, op in ops.items():
                                      if not isinstance(op, dict): continue
                                      params = [(x.get("name"), x.get("in")) for x in op.get("parameters", [])]
                                      print(f"  {mm.upper()} {p} | {op.get('summary','')} | params={params}")
                                      rb = op.get("requestBody")
                                      if rb: print("     body:", json.dumps(rb, ensure_ascii=False)[:600])
                              print("  securitySchemes:", json.dumps(spec.get("components", {}).get("securitySchemes", {}), ensure_ascii=False))
                              print("  schemas:", list(spec.get("components", {}).get("schemas", {}).keys())[:80])
                          else:
                              print(text(b)[:3000])
                      break
          for p in ["/api/v1/accounts", "/api/public/v1/accounts"]:
              for auth in ("x", "b"):
                  st, ct, b = get("https://api.truestats.ru" + p, auth)
                  print(f"check {p} auth={auth} -> {st}")
