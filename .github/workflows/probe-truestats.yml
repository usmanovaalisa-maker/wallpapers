name: Разведка API TrueStats (временно)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TRUE_STATS: ${{ secrets.TRUE_STATS }}
    steps:
      - name: Формат метода «по дням» и пробный вызов (в лог — только структура, без сумм)
        shell: python
        run: |
          import re, os, json, html, urllib.request, datetime as dt
          key = os.environ["TRUE_STATS"].strip()
          def req(u, body=None, auth=True):
              h = {"User-Agent": "Mozilla/5.0", "Accept": "application/json", "Content-Type": "application/json"}
              if auth: h["X-Api-Token"] = key
              r = urllib.request.Request(u, headers=h, data=json.dumps(body).encode() if body is not None else None)
              try:
                  with urllib.request.urlopen(r, timeout=60) as resp:
                      return resp.status, resp.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")[:800]
          st, b = req("https://api.truestats.ru/api/public/doc", auth=False)
          m = re.search(r'id="swagger-data"[^>]*>(.*?)</script>', b, re.S)
          spec = json.loads(html.unescape(m.group(1)))
          spec = spec.get("spec", spec)
          print("servers:", spec.get("servers"))
          schemas = spec["components"]["schemas"]
          def resolve(x, depth=0):
              if depth > 6: return "…"
              if isinstance(x, dict):
                  if "$ref" in x: return resolve(schemas.get(x["$ref"].split("/")[-1], {}), depth + 1)
                  return {k: resolve(v, depth + 1) for k, v in x.items() if k not in ("example",) or depth < 3}
              if isinstance(x, list): return [resolve(i, depth + 1) for i in x]
              return x
          for path in ["/reporting/aggregated-view/day", "/reporting/main/stats", "/v1/accounts", "/accounts"]:
              op = spec["paths"].get(path, {}).get("post") or spec["paths"].get(path, {}).get("get")
              if not op: continue
              print(f"\n=== {path}: {op.get('summary')}\n{op.get('description','')}")
              print("REQUEST:", json.dumps(resolve(op.get("requestBody", {})), ensure_ascii=False)[:5000])
              print("RESPONSES:", json.dumps(resolve(op.get("responses", {})), ensure_ascii=False)[:6000])
          acc = [p for p in spec["paths"] if "account" in p.lower()]
          print("\naccount paths:", acc)

          base = (spec.get("servers") or [{"url": "https://api.truestats.ru"}])[0]["url"].rstrip("/")
          y = dt.date.today() - dt.timedelta(days=1)
          body = {"dateFrom": (y - dt.timedelta(days=6)).isoformat(), "dateTo": y.isoformat()}
          for b2 in (body, {"period": body}, {"date_from": body["dateFrom"], "date_to": body["dateTo"]}):
              st, r = req(base + "/reporting/aggregated-view/day", b2)
              print(f"\nCALL body-keys={list(b2)} -> {st}")
              if st != 200:
                  print("  error:", r[:600]); continue
              d = json.loads(r)
              def shape(x, depth=0):
                  if isinstance(x, dict): return {k: shape(v, depth + 1) for k, v in list(x.items())[:60]} if depth < 5 else "{…}"
                  if isinstance(x, list): return [shape(x[0], depth + 1), f"…×{len(x)}"] if x else []
                  return type(x).__name__
              print("  shape:", json.dumps(shape(d), ensure_ascii=False)[:6000])
              break
